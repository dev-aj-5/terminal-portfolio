<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⌨️</text></svg>">
</head>
<body>
    <canvas id="matrix-rain"></canvas>
    <div class="crt-overlay"></div>

    <div class="terminal" id="terminal">
        <div class="terminal-header">
            <div class="terminal-buttons">
                <button class="terminal-button red">●</button>
                <button class="terminal-button yellow">●</button>
                <button class="terminal-button green">●</button>
            </div>
            <div class="terminal-title">guest@portfolio:~</div>
            <div class="terminal-controls">
                <button id="mute-btn" class="control-btn">🔊</button>
            </div>
        </div>

        <div class="terminal-window">
            <div id="boot-screen" class="boot-screen">
                <div class="boot-container">
                    <div class="boot-text" id="boot-text"></div>
                    <pre id="banner-art" style="display:none;">
██   ██ ██     ██ ██████   ████████ 
██   ██ ██     ██ ██   ██     ██    
███████ ██  █  ██ ██████      ██    
██   ██ ██ ███ ██ ██   ██     ██    
██   ██  ███ ███  ██████      ██    
                    </pre>
                    <div class="boot-progress">
                        <div class="progress-bar" id="progress-bar"></div>
                        <div class="progress-text" id="progress-text">0%</div>
                    </div>
                </div>
            </div>

            <div id="terminal-content" class="terminal-content">
                <div id="output" class="output"></div>
                <div class="input-line">
                    <span class="prompt">guest@portfolio:~$</span>
                    <input type="text" id="command-line" autocomplete="off" spellcheck="false">
                    <span class="cursor">█</span>
                </div>
            </div>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
